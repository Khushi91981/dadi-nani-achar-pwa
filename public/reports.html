<!DOCTYPE html>
<html>
<head>
  <title>Reports – दादी–नानी अचार</title>
<!-- common-head.html -->
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="/src/css/style.css" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#7b0000" />

</head>
<body>

<div class="app">

<aside class="sidebar">
  <h2>दादी–नानी अचार</h2>

  <nav>
    <a href="dashboard.html">🏠 Dashboard</a>
    <a href="users.html" id="usersLink">👤 Users</a>
    <a href="orders.html">📦 Orders</a>
    <a href="expenses.html">💸 Expenses</a>
    <a href="reports.html">📊 Reports</a>
  </nav>
</aside>


  <div class="main">

    <div class="page-header">
      <div>
        <h2>Reports</h2>
        <p class="role-text">Orders − Expenses = Profit</p>
      </div>
      <button id="logoutBtn" class="btn-outline">Logout</button>
    </div>

    <!-- FILTER -->
    <div class="card">
      <h3>Filter</h3>
      <div class="form-grid">
        <select id="rangeType">
          <option value="today">Today</option>
          <option value="month">This Month</option>
          <option value="custom">Custom</option>
        </select>

        <input type="date" id="fromDate" class="hidden">
        <input type="date" id="toDate" class="hidden">

        <button class="btn" id="applyFilter">Apply</button>
      </div>
    </div>

    <!-- SUMMARY -->
    <div class="report-grid">

  <div class="report-card">
    <h4>Total Orders</h4>
    <p id="totalOrders">₹0</p>
  </div>

  <div class="report-card">
    <h4>Total Expenses</h4>
    <p id="totalExpenses">₹0</p>
  </div>

  <div class="report-card profit">
    <h4>Net Profit</h4>
    <p id="netProfit">₹0</p>
  </div>

</div>


  </div>
</div>

<script type="module" src="/src/js/reports.js"></script>
<script type="module" src="/src/js/layout.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js")
        .then(() => console.log("PWA Service Worker registered"))
        .catch(err => console.error("SW error", err));
    });
  }
</script>

</body>
</html>
