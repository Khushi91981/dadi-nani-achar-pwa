<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Recipes – दादी–नानी अचार</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="./src/css/style.css" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#7b0000" />
</head>

<body>
<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h2>दादी–नानी अचार</h2>
    <nav>
      <a href="dashboard.html">🏠 Dashboard</a>
      <a href="users.html">👤 Users</a>
      <a href="products.html">🧺 Products</a>
      <a href="orders.html">📦 Orders</a>
      <a class="active" href="recipes.html">📘 Recipes</a>
      <a href="expenses.html">💸 Expenses</a>
      <a href="reports.html">📊 Reports</a>
    </nav>
  </aside>

  <!-- MAIN -->
  <main class="main">

    <!-- HEADER -->
    <div class="page-header">
      <div>
        <h2>Recipes</h2>
        <p>Read-only recipe document library</p>
      </div>
      <button id="logoutBtn" class="btn-outline">Logout</button>
    </div>

    <!-- ADD RECIPE (METADATA ONLY) -->
    <div class="card">
      <h3>Add Recipe Entry</h3>

      <div class="form-grid">
        <input id="title" placeholder="Recipe Title (e.g. Nimbu Achaar – 1 KG)">
        <input id="filePath" placeholder="/recipes/nimbu-achaar-1kg.pdf">
        <input id="uploadedBy" placeholder="Uploaded By (Name)">
        <button id="saveRecipe" class="btn">Save Recipe</button>
      </div>

      <p style="margin-top:10px; font-size:13px; color:#6b7280;">
        Upload files via GitHub → <code>public/recipes/</code>
      </p>
    </div>

    <!-- RECIPE LIST -->
    <div class="card">
      <h3>Recipe Library</h3>

      <table class="data-table">
        <thead>
          <tr>
            <th>Recipe Title</th>
            <th>File</th>
            <th>Added On</th>
            <th>Added By</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="recipesTable"></tbody>
      </table>
    </div>

  </main>
</div>

<script type="module" src="./src/js/recipes.js"></script>
<script type="module" src="./src/js/layout.js"></script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js");
    });
  }
</script>
</body>
</html>
