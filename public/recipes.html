<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Recipes</title>
  <link rel="stylesheet" href="src/css/style.css" />
</head>
<body>

<header class="topbar">
  <h2>Recipes</h2>
  <button id="logoutBtn" class="btn-outline">Logout</button>
</header>

<section class="card">
  <h3>Add Recipe</h3>

  <form id="recipeForm">
    <input id="titleInput" type="text" placeholder="Recipe Title" required />
    <input id="uploadedByInput" type="text" placeholder="Uploaded By" required />
    <input id="fileInput" type="file" accept=".pdf,.doc,.docx,.png,.jpg" required />
    <button class="btn-primary">Upload Recipe</button>
  </form>

  <small>Files are stored in <b>/public/recipes/</b></small>
</section>

<section class="card">
  <h3>Recipe Library</h3>

  <table>
    <thead>
      <tr>
        <th>Title</th>
        <th>File</th>
        <th>Added On</th>
        <th>Added By</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="recipesTable"></tbody>
  </table>
</section>

<script type="module" src="src/js/recipes.js"></script>
</body>
</html>
