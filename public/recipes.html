<!DOCTYPE html>
<html>
<head>
  <title>Recipes – दादी–नानी अचार</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./src/css/style.css" />
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <h2>दादी–नानी अचार</h2>
    <nav>
      <a href="dashboard.html">🏠 Dashboard</a>
      <a href="products.html">🧺 Products</a>
      <a href="orders.html">📦 Orders</a>
      <a class="active" href="recipes.html">📘 Recipes</a>
    </nav>
  </aside>

  <main class="main">
    <div class="page-header">
      <div>
        <h2>Recipes</h2>
        <p>Read-only recipe document library</p>
      </div>
      <button id="logoutBtn" class="btn-outline">Logout</button>
    </div>

    <div class="card">
      <h3>Add Recipe</h3>
      <form id="recipeForm" class="form-grid">
        <input id="title" placeholder="Recipe Title" required />
        <input id="uploadedBy" placeholder="Uploaded By" required />
        <input id="file" type="file" accept=".pdf,.doc,.docx,.jpg,.png" required />
        <button class="btn">Upload Recipe</button>
      </form>
    </div>

    <div class="card">
      <h3>Recipe Library</h3>
      <table class="data-table">
        <thead>
          <tr>
            <th>Title</th>
            <th>File</th>
            <th>Added On</th>
            <th>Added By</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="recipesTable"></tbody>
      </table>
    </div>
  </main>
</div>

<script type="module" src="./src/js/recipes.js"></script>
</body>
</html>
