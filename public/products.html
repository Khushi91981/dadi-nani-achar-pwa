<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Products – दादी–नानी अचार</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="./src/css/style.css" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#7b0000" />
</head>

<body>
<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h2>दादी–नानी अचार</h2>
    <nav>
      <a href="dashboard.html">🏠 Dashboard</a>
      <a href="users.html">👤 Users</a>
      <a class="active" href="products.html">🧺 Products</a>
      <a href="orders.html">📦 Orders</a>
      <a href="expenses.html">💸 Expenses</a>
      <a href="reports.html">📊 Reports</a>
    </nav>
  </aside>

  <!-- MAIN -->
  <main class="main">

    <!-- HEADER -->
    <div class="page-header">
      <div>
        <h2>Products</h2>
        <p>Manage achaar products & pricing</p>
      </div>
      <button id="logoutBtn" class="btn-outline">Logout</button>
    </div>

    <!-- ADD PRODUCT -->
    <div class="card">
      <h3>Add Product</h3>

      <div class="form-grid">
        <input id="name" placeholder="Product Name">
        <input id="price" type="number" placeholder="Price per KG">
        <input id="madeBy" placeholder="Achaar Made By (Name)">
        <input id="createdBy" placeholder="Created By (Name)">
        <button id="saveProduct" class="btn">Add Product</button>
      </div>
    </div>

    <!-- PRODUCT LIST -->
    <div class="card">
      <h3>Product List</h3>

      <table class="data-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Per KG Price</th>
            <th>Made By</th>
            <th>Created By</th>
            <th>Created Date</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="productsTable"></tbody>
      </table>
    </div>

  </main>
</div>

<script type="module" src="./src/js/products.js"></script>
<script type="module" src="./src/js/layout.js"></script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js");
    });
  }
</script>
</body>
</html>
