<!DOCTYPE html>
<html lang="en">
<head>
  <title>Products – दादी–नानी अचार</title>

  <!-- COMMON HEAD -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./src/css/style.css" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#7b0000" />
</head>

<body>
<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h2>दादी–नानी अचार</h2>

    <nav>
      <a href="dashboard.html">🏠 Dashboard</a>
      <a href="users.html" id="usersLink">👤 Users</a>
      <a href="products.html" class="active">🧺 Products</a>
      <a href="orders.html">📦 Orders</a>
      <a href="expenses.html">💸 Expenses</a>
      <a href="reports.html">📊 Reports</a>
    </nav>
  </aside>

  <!-- MAIN -->
  <main class="main">

    <!-- HEADER -->
    <div class="page-header">
      <div>
        <h2>Products</h2>
        <p class="role-text">Manage achaar products & pricing</p>
      </div>

      <button id="logoutBtn" class="btn-outline">Logout</button>
    </div>

    <!-- ADD PRODUCT -->
    <div class="card">
      <h3>Add Product</h3>

      <form id="productForm" class="form-grid">
        <input
          type="text"
          name="name"
          placeholder="Product Name"
          required
        />

        <input
          type="number"
          name="pricePerKg"
          placeholder="Price per KG"
          required
        />

        <input
          type="text"
          name="madeBy"
          placeholder="Achaar made by (Name)"
          required
        />

        <input
          type="text"
          name="createdBy"
          placeholder="Created by (Name)"
          required
        />

        <button type="submit" class="btn">
          ➕ Add Product
        </button>
      </form>
    </div>

    <!-- PRODUCT LIST -->
    <div class="card">
      <h3>Product List</h3>

      <table class="data-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Per KG Price</th>
            <th>Made By</th>
            <th>Created By</th>
            <th>Created Date</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="productTable"></tbody>
      </table>
    </div>

  </main>
</div>

<!-- AUTH GUARD -->
<script type="module">
  import { requireAuth } from "./src/js/auth-guard.js";

  requireAuth((user) => {
    // Hide Users tab for non-admin
    if (user.role !== "admin") {
      const usersLink = document.getElementById("usersLink");
      if (usersLink) usersLink.style.display = "none";
    }
  });
</script>

<!-- LOGOUT + LAYOUT -->
<script type="module" src="./src/js/layout.js"></script>

<!-- PRODUCTS LOGIC -->
<script type="module" src="./src/js/products.js"></script>

<!-- PWA -->
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js");
    });
  }
</script>

</body>
</html>
