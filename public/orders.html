<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Orders – दादी–नानी अचार</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./src/css/style.css" />
</head>

<body>
<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h2>दादी–नानी अचार</h2>
    <nav>
      <a href="dashboard.html">🏠 Dashboard</a>
      <a href="users.html">👤 Users</a>
      <a class="active" href="orders.html">📦 Orders</a>
      <a href="expenses.html">💸 Expenses</a>
      <a href="reports.html">📊 Reports</a>
    </nav>
  </aside>

  <!-- MAIN -->
  <main class="main">

    <!-- HEADER -->
    <div class="page-header">
      <div>
        <h2>Orders</h2>
        <p>Manage customer orders</p>
      </div>
      <button id="logoutBtn" class="btn-outline">Logout</button>
    </div>

    <!-- ADD ORDER -->
    <div class="card">
      <h3>Add New Order</h3>

      <div class="form-grid">
        <input id="customer" placeholder="Customer Name">
        <input id="product" placeholder="Product">
        <input id="price" type="number" placeholder="Price / KG">
        <input id="qty" type="number" step="0.01" placeholder="Qty (KG)">
        <input id="delivery" type="number" placeholder="Delivery Charge">

        <select id="payment">
          <option>Not Paid Yet</option>
          <option>Paid</option>
        </select>

        <select id="status">
          <option>New</option>
          <option>Being Prepared</option>
          <option>Delivered</option>
        </select>

        <button id="saveOrder" class="btn">Save Order</button>
      </div>
    </div>

    <!-- ORDERS LIST -->
    <div class="card">
      <h3>Orders List</h3>

      <!-- SEARCH -->
      <input
        id="orderSearch"
        placeholder="Search by customer, product, payment or status"
        style="max-width:360px; margin-bottom:12px;"
      />

      <table class="data-table">
        <thead>
          <tr>
            <th>Customer</th>
            <th>Product</th>
            <th>Qty</th>
            <th>Price</th>
            <th>Delivery</th>
            <th>Total</th>
            <th>Payment</th>
            <th>Status</th>
            <th>Created</th>
            <th>Delivery Date</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody id="ordersTable"></tbody>
      </table>
    </div>

  </main>
</div>

<script type="module" src="./src/js/orders.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js")
        .then(() => console.log("PWA Service Worker registered"))
        .catch(err => console.error("SW error", err));
    });
  }
</script>
</body>
</html>
