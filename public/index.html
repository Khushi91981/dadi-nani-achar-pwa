<!DOCTYPE html>
<html lang="en">
<head>
  <title>Login – दादी–नानी अचार</title>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="./src/css/style.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#7b0000" />
</head>

<body class="login-body">

<!-- LOGIN BOX -->
<div class="login-box" id="loginBox">
  <h2>Login</h2>

  <input id="email" placeholder="Email" />
  <input id="password" type="password" placeholder="Password" />

  <label class="remember">
    <input type="checkbox" id="rememberMe" />
    <span>Remember me</span>
  </label>

  <button id="loginBtn" class="btn">Login</button>

  <p class="forgot">
    <button type="button" id="openReset">Forgot password?</button>
  </p>
</div>

<!-- RESET PASSWORD MODAL -->
<div class="modal hidden" id="resetModal">
  <div class="modal-box">
    <h3>Reset Password</h3>

    <input id="resetEmail" placeholder="Enter your email" />

    <div class="modal-actions">
      <button id="closeReset" class="btn-outline">Cancel</button>
      <button id="sendReset" class="btn">Send Reset Link</button>
    </div>
  </div>
</div>

<!-- LOGIN SCRIPT -->
<script type="module">
import { auth } from "./src/js/firebase.js";
import {
  signInWithEmailAndPassword,
  setPersistence,
  browserLocalPersistence,
  browserSessionPersistence
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

document.getElementById("loginBtn").onclick = async () => {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const remember = document.getElementById("rememberMe").checked;

  if (!email || !password) {
    alert("Enter email & password");
    return;
  }

  try {
    await setPersistence(
      auth,
      remember ? browserLocalPersistence : browserSessionPersistence
    );

    await signInWithEmailAndPassword(auth, email, password);
    window.location.href = "dashboard.html";
  } catch (err) {
    alert(err.message);
  }
};
</script>

<!-- RESET PASSWORD SCRIPT -->
<script type="module">
import { auth } from "./src/js/firebase.js";
import { sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const modal = document.getElementById("resetModal");

document.getElementById("openReset").onclick = () => {
  modal.classList.remove("hidden");
};

document.getElementById("closeReset").onclick = () => {
  modal.classList.add("hidden");
};

document.getElementById("sendReset").onclick = async () => {
  const email = document.getElementById("resetEmail").value.trim();

  if (!email) {
    alert("Enter your email");
    return;
  }

  try {
    await sendPasswordResetEmail(auth, email);
    alert("Reset email sent. Check your inbox.");
    modal.classList.add("hidden");
  } catch (err) {
    alert(err.message);
  }
};
</script>

<!-- PWA -->
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js");
  });
}
</script>

</body>
</html>
